<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="studio-reload" content="off">
<title>File preview</title>
<style>
:root { color-scheme: light dark; --bg: #f4f5f7; --panel: #ffffff; --line: #d9dce3; --text: #1b1f27; --muted: #5d6675;
        --accent: #3b5bdb; --accent-text: #ffffff; --bad: #c0362c; --bad-bg: #fdecea; --head: #eef0f4; --sel: #dbe4ff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --panel: #1d2026; --line: #343944; --text: #e8eaee; --muted: #9aa3b2; --accent: #7c93ff;
          --accent-text: #0e1116; --bad: #ff8a80; --bad-bg: #3a1d1b; --head: #262a32; --sel: #2c3a66; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
       display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel);
         border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.kind { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 7px;
        border-radius: 5px; background: var(--head); color: var(--muted); flex: none; }
.name { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 8rem; }
.meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
.actions { display: flex; gap: 6px; flex: none; }
a.btn, button { font: inherit; font-size: 14px; font-weight: 600; min-height: 36px; padding: 0 12px; border-radius: 8px;
                border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
                display: inline-flex; align-items: center; text-decoration: none; }
a.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
button:disabled { opacity: .4; cursor: default; }
main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* slides */
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; }
.stage img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 4px; box-shadow: 0 2px 14px rgba(0,0,0,.22); }
.nav { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 10px 8px; flex: none; }
.nav span { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 5.5rem; text-align: center; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); flex: none;
         background: var(--panel); border-top: 1px solid var(--line); }
.strip button { padding: 0; min-height: 0; border: 2px solid transparent; border-radius: 5px; background: none; flex: none; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip img { display: block; height: 62px; border-radius: 3px; background: #fff; }

/* pages */
.pages { flex: 1; overflow-y: auto; padding: 14px 10px calc(14px + env(safe-area-inset-bottom)); }
.pages img { display: block; width: min(100%, 900px); height: auto; margin: 0 auto 14px; background: #fff;
             box-shadow: 0 1px 10px rgba(0,0,0,.2); }
.more { text-align: center; color: var(--muted); padding: 6px 0 16px; }

/* workbook */
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 6px 10px 0; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
.tabs button { border-radius: 8px 8px 0 0; border-bottom: 0; background: var(--head); color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: inset 0 2px 0 var(--accent); }
.fx[hidden] { display: none; }
.grid .pages { padding: 14px 10px; }
.fx { display: flex; gap: 10px; align-items: baseline; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; flex: none; min-height: 34px; }
.fx b { color: var(--muted); min-width: 3.2rem; }
.fx span { overflow-wrap: anywhere; }
.grid { flex: 1; overflow: auto; background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
table { border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 8px; white-space: nowrap;
         max-width: 26rem; overflow: hidden; text-overflow: ellipsis; height: 26px; }
th { position: sticky; background: var(--head); color: var(--muted); font-weight: 600; text-align: center; z-index: 1; }
thead th { top: 0; z-index: 2; }
tbody th { left: 0; min-width: 2.6rem; }
thead th:first-child { left: 0; z-index: 3; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
td.e { background: var(--bad-bg) !important; color: var(--bad) !important; font-weight: 600; }
td.f { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
td.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.note { padding: 6px 12px; color: var(--muted); font-size: 13px; background: var(--panel); border-top: 1px solid var(--line); flex: none; }
.note.bad { color: var(--bad); }
</style>
</head>
<body>
<header>
  <span class="kind" id="kind"></span>
  <span class="name" id="name"></span>
  <span class="meta" id="meta"></span>
  <span class="actions" id="actions"></span>
</header>
<main id="main"></main>
<script>
const DATA = /*DATA*/null;
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "text") el.textContent = value; else if (key in el && key !== "list") el[key] = value; else el.setAttribute(key, value);
  }
  el.append(...kids);
  return el;
};
const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

function start() {
  const main = document.getElementById("main");
  if (!DATA) { main.append($("p", { className: "more", text: "This preview has no data." })); return; }
  document.title = DATA.name;
  document.getElementById("kind").textContent = DATA.label;
  document.getElementById("name").textContent = DATA.name;
  document.getElementById("name").title = DATA.name;
  const count = DATA.kind === "workbook" ? plural(DATA.sheets.length, "sheet")
    : plural(DATA.page_count, DATA.kind === "presentation" ? "slide" : "page");
  document.getElementById("meta").textContent = count + " · " + size(DATA.bytes);
  const actions = document.getElementById("actions");
  if (DATA.pdf) actions.append($("a", { className: "btn", href: DATA.pdf, target: "_blank", rel: "noopener", text: "Open PDF" }));
  actions.append($("a", { className: "btn primary", href: DATA.file, download: DATA.name, text: "Download" }));
  if (DATA.kind === "presentation") slides(main); else if (DATA.kind === "workbook") workbook(main); else pages(main);
}

function slides(main) {
  let at = 0;
  const image = $("img", { alt: "" });
  const stage = $("div", { className: "stage" }, image);
  const label = $("span");
  const prev = $("button", { type: "button", text: "‹ Previous" }), next = $("button", { type: "button", text: "Next ›" });
  const strip = $("div", { className: "strip" });
  const thumbs = DATA.pages.map((file, index) => {
    const button = $("button", { type: "button", title: "Slide " + (index + 1) }, $("img", { src: file, alt: "Slide " + (index + 1), loading: "lazy" }));
    button.addEventListener("click", () => go(index));
    strip.append(button);
    return button;
  });
  function go(index) {
    at = Math.max(0, Math.min(DATA.pages.length - 1, index));
    image.src = DATA.pages[at];
    image.alt = "Slide " + (at + 1);
    label.textContent = (at + 1) + " of " + DATA.page_count;
    prev.disabled = at === 0;
    next.disabled = at === DATA.pages.length - 1;
    thumbs.forEach((button, i) => button.setAttribute("aria-current", String(i === at)));
    thumbs[at].scrollIntoView({ block: "nearest", inline: "center" });
  }
  prev.addEventListener("click", () => go(at - 1));
  next.addEventListener("click", () => go(at + 1));
  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") { event.preventDefault(); go(at + 1); }
    if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); go(at - 1); }
  });
  let startX = null;
  stage.addEventListener("touchstart", (event) => { startX = event.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", (event) => {
    if (startX === null) return;
    const moved = event.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(moved) > 45) go(at + (moved < 0 ? 1 : -1));
  });
  main.append(stage, $("div", { className: "nav" }, prev, label, next), strip);
  if (DATA.page_count > DATA.pages.length) main.append($("div", { className: "note", text: "Showing the first " + DATA.pages.length + " slides. Download the file for the rest." }));
  go(0);
}

function pages(main) {
  const list = $("div", { className: "pages" });
  DATA.pages.forEach((file, index) => list.append($("img", { src: file, alt: "Page " + (index + 1), loading: index < 2 ? "eager" : "lazy" })));
  if (DATA.page_count > DATA.pages.length) list.append($("div", { className: "more", text: "Showing the first " + DATA.pages.length + " of " + DATA.page_count + " pages. Download the file for the rest." }));
  main.append(list);
}

function letters(n) {
  let out = "";
  for (n += 1; n > 0; n = Math.floor((n - 1) / 26)) out = String.fromCharCode(65 + (n - 1) % 26) + out;
  return out;
}

function workbook(main) {
  const tabs = $("div", { className: "tabs", role: "tablist" });
  const ref = $("b"), shown = $("span");
  const fx = $("div", { className: "fx" }, ref, shown);
  const grid = $("div", { className: "grid" });
  const note = $("div", { className: "note" });
  let selected = null;
  function pick(td, cell, name) {
    if (selected) selected.classList.remove("sel");
    selected = td;
    td.classList.add("sel");
    ref.textContent = name;
    shown.textContent = cell.f ? cell.f + "   →   " + (cell.t || "") : (cell.t || "");
  }
  function show(index) {
    const sheet = DATA.sheets[index];
    [...tabs.children].forEach((tab, i) => tab.setAttribute("aria-selected", String(i === index)));
    ref.textContent = ""; shown.textContent = "Select a cell to see its formula."; selected = null;
    const columns = sheet.cells.reduce((most, row) => Math.max(most, row.length), 0);
    const head = $("tr", {}, $("th"));
    for (let c = 0; c < columns; c++) head.append($("th", { text: letters(c), style: "min-width:" + Math.min(360, sheet.widths[c] || 72) + "px" }));
    const body = $("tbody");
    sheet.cells.forEach((row, r) => {
      const tr = $("tr", {}, $("th", { text: String(r + 1) }));
      row.forEach((cell, c) => {
        const td = $("td", { text: cell.t || "" });
        td.className = (cell.n ? "n " : "") + (cell.f ? "f " : "") + (cell.e ? "e" : "");
        if (cell.b) td.style.fontWeight = "700";
        if (cell.bg) { td.style.background = cell.bg; if (!cell.fg) td.style.color = "#1b1f27"; }
        if (cell.fg) td.style.color = cell.fg;
        if (cell.a) td.style.textAlign = cell.a;
        td.addEventListener("click", () => pick(td, cell, letters(c) + (r + 1)));
        tr.append(td);
      });
      body.append(tr);
    });
    grid.replaceChildren($("table", {}, $("thead", {}, head), body));
    grid.scrollTop = 0; grid.scrollLeft = 0;
    const errors = sheet.error_count ?? sheet.errors.length;   // the list itself is capped
    note.className = "note" + (errors ? " bad" : "");
    note.textContent = [plural(sheet.rows, "row") + " × " + plural(sheet.columns, "column"), plural(sheet.formulas, "formula"),
      errors ? plural(errors, "formula") + " with an error: " + sheet.errors.slice(0, 6).map((e) => e.cell).join(", ") : "",
      sheet.unchecked ? plural(sheet.unchecked, "formula") + " not checked" : "",
      sheet.cut ? "showing the first " + sheet.cells.length + " rows; download the file for all of it" : ""].filter(Boolean).join(" · ");
  }
  DATA.sheets.forEach((sheet, index) => {
    const tab = $("button", { type: "button", role: "tab", text: sheet.name + (sheet.charts ? " ◔" : "") });
    tab.addEventListener("click", () => { fx.hidden = false; show(index); });
    tabs.append(tab);
  });
  if (DATA.pages && DATA.pages.length) {
    // Charts are drawn by the spreadsheet program; the print view is where they can be seen here.
    const tab = $("button", { type: "button", role: "tab", text: "Charts" });
    tab.addEventListener("click", () => {
      [...tabs.children].forEach((other) => other.setAttribute("aria-selected", String(other === tab)));
      fx.hidden = true;
      const list = $("div", { className: "pages" });
      DATA.pages.forEach((file, index) => list.append($("img", { src: file, alt: "Sheet " + (index + 1) + " as a picture", loading: "lazy" })));
      grid.replaceChildren(list);
      note.className = "note";
      note.textContent = "Each sheet as one picture, with its charts drawn. Sheets with charts are marked ◔.";
    });
    tabs.append(tab);
  }
  main.append(tabs, fx, grid, note);
  show(0);
}
start();
</script>
</body>
</html>
