<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, CanvasText 14%, Canvas); --muted: color-mix(in srgb, CanvasText 60%, Canvas); }
  html { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.55; }
  body { margin: 0; background: Canvas; color: CanvasText; }
  .hint { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: .8rem 1rem; }

  main { max-width: 64rem; margin: 0 auto; padding: 3rem 2rem; }
  code { font-size: .92em; }
</style>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <p class="hint">Empty app with a Python back end. Tell the assistant what it should fetch, store or compute.<br>
  Back end: <code>server.py</code> · page: <code>static/index.html</code> · server status: <span id="health">checking…</span></p>
</main>
<script>
  fetch("api/health").then((r) => r.json())
    .then((d) => { document.getElementById("health").textContent = "running since " + new Date(d.started_at).toLocaleTimeString(); })
    .catch(() => { document.getElementById("health").textContent = "not reachable"; });
</script>
</body>
</html>
