<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, CanvasText 14%, Canvas); --muted: color-mix(in srgb, CanvasText 60%, Canvas); }
  html { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.55; }
  body { margin: 0; background: Canvas; color: CanvasText; }
  .hint { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: .8rem 1rem; }

  main { max-width: 80rem; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
  h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
  .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.2rem; min-height: 5rem; }
  .charts .card { min-height: 18rem; }
  .wide { grid-column: 1 / -1; }
  .empty { color: var(--muted); display: grid; place-items: center; height: 100%; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <p class="sub">No data connected yet.</p>

  <section class="kpis" id="kpis">
    <div class="card"><div class="empty">Headline number</div></div>
    <div class="card"><div class="empty">Headline number</div></div>
    <div class="card"><div class="empty">Headline number</div></div>
    <div class="card"><div class="empty">Headline number</div></div>
  </section>

  <section class="charts" id="charts">
    <div class="card wide"><div class="empty">Drop a CSV or Excel file onto this page, or tell the assistant where the data is.<br>It replaces these boxes with numbers and charts computed from that data.</div></div>
    <div class="card"><div class="empty">Chart</div></div>
    <div class="card"><div class="empty">Chart</div></div>
  </section>
</main>
</body>
</html>
